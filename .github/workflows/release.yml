name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── macOS build ────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Homebrew tools
        run: brew install create-dmg

      - name: Setup venv & install deps
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install py2app Pillow rubicon-objc

      - name: Pre-download Whisper model
        run: |
          source venv/bin/activate
          python -c "from faster_whisper import WhisperModel; WhisperModel('small', device='cpu', compute_type='int8')"

      - name: Build DMG
        run: |
          source venv/bin/activate
          ./build_dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: voxaho-macos
          path: Voxaho-*.dmg
          retention-days: 30

      # ── SCP upload (bash natif, marche sur macOS runner) ────────────────────
      - name: Configure SSH key
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload DMG to VPS
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          scp -i ~/.ssh/deploy_key Voxaho-*.dmg \
            "${VPS_USER}@${VPS_HOST}:/var/www/voxaho-downloads/"

      - name: Update 'latest' symlink for DMG
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ssh -i ~/.ssh/deploy_key "${VPS_USER}@${VPS_HOST}" \
            "cd /var/www/voxaho-downloads && ln -sfn Voxaho-${VERSION}.dmg Voxaho-latest.dmg"

  # ── Windows build ──────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: cmd
        run: |
          python -m venv venv
          call venv\Scripts\activate.bat
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Pre-download Whisper model
        shell: cmd
        run: |
          call venv\Scripts\activate.bat
          python -c "from faster_whisper import WhisperModel; WhisperModel('small', device='cpu', compute_type='int8')"

      - name: Generate Windows icon (.ico)
        shell: cmd
        run: |
          call venv\Scripts\activate.bat
          pip install Pillow
          python scripts\gen_windows_icon.py

      - name: Build EXE with PyInstaller
        shell: cmd
        run: |
          call venv\Scripts\activate.bat
          pyinstaller ^
            --name "Voxaho" ^
            --onefile ^
            --windowed ^
            --icon "assets\AppIcon.ico" ^
            --add-data "assets;assets" ^
            --hidden-import "faster_whisper" ^
            --hidden-import "sounddevice" ^
            --hidden-import "numpy" ^
            --hidden-import "pynput" ^
            --hidden-import "pyperclip" ^
            --hidden-import "pyautogui" ^
            --hidden-import "PyQt6" ^
            --collect-all "faster_whisper" ^
            --collect-all "ctranslate2" ^
            main.py

      - name: Build Inno Setup installer (if available)
        shell: cmd
        continue-on-error: true
        run: |
          choco install innosetup -y
          iscc build_installer.iss

      - name: Rename versioned EXE
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="dev"
          fi
          mkdir -p win-out
          [ -f dist/Voxaho.exe ] && cp "dist/Voxaho.exe" "win-out/Voxaho-${VERSION}.exe" || true
          # Setup-version exe est déjà nommé correctement par Inno Setup s'il a marché
          if compgen -G "Output/*.exe" > /dev/null; then
            cp Output/*.exe win-out/
          fi
          if compgen -G "Voxaho-Setup-*.exe" > /dev/null; then
            cp Voxaho-Setup-*.exe win-out/
          fi
          echo "=== win-out/ ==="
          ls -la win-out/ || echo "(vide)"

      - name: Upload Windows artifact (GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: voxaho-windows
          path: win-out/*
          retention-days: 30
          if-no-files-found: warn

      # ── SCP upload (bash natif via Git Bash sur Windows runner) ─────────────
      - name: Configure SSH key
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload Windows artifacts to VPS
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$(ls -A win-out/ 2>/dev/null)" ]; then
            echo "win-out/ vide, rien à uploader"
            exit 0
          fi
          scp -i ~/.ssh/deploy_key win-out/* \
            "${VPS_USER}@${VPS_HOST}:/var/www/voxaho-downloads/"

      - name: Update 'latest' symlinks for Windows
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ssh -i ~/.ssh/deploy_key "${VPS_USER}@${VPS_HOST}" bash <<EOF
            cd /var/www/voxaho-downloads
            # EXE one-file
            [ -f "Voxaho-${VERSION}.exe" ] && ln -sfn "Voxaho-${VERSION}.exe" Voxaho-latest.exe
            # Setup installer (Inno) — optionnel
            [ -f "Voxaho-Setup-${VERSION}.exe" ] && ln -sfn "Voxaho-Setup-${VERSION}.exe" Voxaho-Setup-latest.exe
            ls -la
          EOF
